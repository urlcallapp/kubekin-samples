# 55 small resources in one namespace.
# Demonstrates: the simplified view for maps with more than 40 resources,
# and the "config & storage" checkbox that restores hidden boxes.
---
apiVersion: v1
kind: Namespace
metadata:
  name: city
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-1
  namespace: city
spec:
  replicas: 1
  selector:
    matchLabels:
      app: svc-1
  template:
    metadata:
      labels:
        app: svc-1
    spec:
      containers:
        - name: app
          image: nginx:1.27
          envFrom:
            - configMapRef:
                name: svc-1-config
---
apiVersion: v1
kind: Service
metadata:
  name: svc-1
  namespace: city
spec:
  selector:
    app: svc-1
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: svc-1-config
  namespace: city
data:
  INDEX: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: svc-1-secret
  namespace: city
type: Opaque
stringData:
  token: example-not-real
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-1
  namespace: city
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: svc-1-data
  namespace: city
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
