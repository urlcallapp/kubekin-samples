# Gateway API instead of Ingress.
# Demonstrates: Gateway + HTTPRoute routing edges to Services.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
        - name: store
          image: nginx:1.27
---
apiVersion: v1
kind: Service
metadata:
  name: store
  namespace: shop
spec:
  selector:
    app: store
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: shop
spec:
  gatewayClassName: example
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store
  namespace: shop
spec:
  parentRefs:
    - name: public
  hostnames:
    - store.example.com
  rules:
    - backendRefs:
        - name: store
          port: 80
