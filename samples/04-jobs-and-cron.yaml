# A scheduled backup CronJob plus a one-off Job, with dedicated RBAC.
# Demonstrates: CronJob/Job icons, ServiceAccount + Role + RoleBinding references.
apiVersion: v1
kind: Namespace
metadata:
  name: maintenance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: maintenance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup
  namespace: maintenance
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup
  namespace: maintenance
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: maintenance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-backup
  namespace: maintenance
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: backup
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: busybox:1.36
              command: ["sh", "-c", "echo backing up && sleep 10"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: one-off-cleanup
  namespace: maintenance
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: backup
      restartPolicy: Never
      containers:
        - name: cleanup
          image: busybox:1.36
          command: ["sh", "-c", "echo cleaning up"]
