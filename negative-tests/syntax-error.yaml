# One valid document and one broken document.
# Demonstrates: the red "incomplete map" banner while the valid part still maps.
apiVersion: v1
kind: Namespace
metadata:
  name: broken-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fine
  namespace: broken-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fine
  template:
    metadata:
      labels:
        app: fine
    spec:
      containers:
        - name: fine
          image: nginx:1.27
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bad-indentation
  namespace: broken-demo
data:
  key1: value1
   key2: value2
